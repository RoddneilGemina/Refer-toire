name: Deploy Refertoire Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Export Web Application
        working-directory: web
        run: npx expo export -p web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ctfxbeltcmmsvagecvyr.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_rM0bbgfuaZJiCRUx_naPwg_mZbROvvl' }}

      - name: Assemble GitHub Pages Structure
        run: |
          mkdir -p dist
          # 1. Root Landing Page
          cp index.html dist/index.html
          touch dist/.nojekyll

          # 2. Web Demo (/web)
          mkdir -p dist/web
          cp -r web/dist/* dist/web/
          cp dist/web/index.html dist/web/404.html

          # 3. APK Directory (/apk)
          mkdir -p dist/apk
          cp apk/Refertoire.apk dist/apk/Refertoire.apk
          cp apk/index.html dist/apk/index.html

          # 4. Backwards-compatibility aliases (/demoapk and /download)
          mkdir -p dist/demoapk
          cp apk/Refertoire.apk dist/demoapk/Refertoire.apk
          cp apk/index.html dist/demoapk/index.html

          mkdir -p dist/download
          cp apk/index.html dist/download/index.html

          # Root mirror
          cp apk/Refertoire.apk dist/Refertoire.apk

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
